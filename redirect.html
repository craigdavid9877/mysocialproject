<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forwarding to SocialPros Storefront...</title>
</head>
<body>
    <div style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        <h2>Connecting to SocialPros.io...</h2>
        <p>Please wait while we route you to the correct package channel.</p>
    </div>

    <script>
        // 1. Extract parameters from the address bar (e.g., ?mt=youtube_views)
        const urlParams = new URLSearchParams(window.location.search);
        const marketingTerm = urlParams.get('mt');

        // 2. Define your primary domain
        const targetDomain = "https://socialpros.io";

        // 3. Establish a standard configuration map for your categories
        let targetPath = "";
        
        if (marketingTerm === "youtube_views") {
            targetPath = "youtube/"; // Tracks back to your YouTube packages
        } else if (marketingTerm === "instagram_followers") {
            targetPath = "instagram/"; // Tracks back to your Instagram packages
        }

        // 4. Combine into a clean destination string with appropriate UTM analytics tokens
        const finalDestination = `${targetDomain}${targetPath}?utm_source=github_router&utm_medium=referral&utm_campaign=${marketingTerm || 'generic_visit'}`;

        // 5. Execute the browser redirect operation
        window.location.href = finalDestination;
    </script>
</body>
</html>
